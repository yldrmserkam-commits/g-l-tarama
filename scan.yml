name: BIST Otomatik Sinyal Tarayici

on:
  schedule:
    # Her saatin 11. ve 40. dakikasında çalışır
    - cron: '11,40 * * * *'
  workflow_dispatch: # Manuel olarak test edebilmen için

jobs:
  tarama_calistir:
    runs-on: ubuntu-latest

    steps:
      - name: Depodaki Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas openpyxl requests tqdm

      - name: Python Tarama Scriptini Çalıştır
        run: python bot.py

      - name: Excel Sonuç Dosyasını Kaydet (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bist-tarama-sonuclari
          path: Filtrli_EMA6_CCI_Kesisim_Sonuclari.xlsx
